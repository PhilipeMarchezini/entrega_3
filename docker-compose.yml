################################################################
# ToggleMaster - ambiente local completo (Fase 2)
#
# 9 contêineres: 5 microsserviços + 4 bancos
#   - postgres-auth   (auth_db)
#   - postgres-apps   (flag_db + targeting_db)
#   - redis           (cache do evaluation-service)
#   - dynamodb-local  (analytics-service)
#
# Subir tudo:      docker compose up --build
# Ver o estado:    docker compose ps
#
# Observação sobre SQS: não existe SQS local. O evaluation-service
# trata AWS_SQS_URL vazia como "eventos desabilitados" e apenas loga.
# Para exercitar o fluxo completo localmente, exporte AWS_SQS_URL e as
# credenciais da AWS antes do `docker compose up`.
################################################################

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U togglemaster"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  # ----------------------------------------------------------------
  # Bancos de dados
  # ----------------------------------------------------------------
  postgres-auth:
    image: postgres:16-alpine
    container_name: tm-postgres-auth
    environment:
      POSTGRES_USER: togglemaster
      POSTGRES_PASSWORD: togglemaster
      POSTGRES_DB: auth_db
    ports: ["5432:5432"]
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./auth-service-main/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: *postgres-healthcheck
    networks: [togglemaster]

  postgres-apps:
    image: postgres:16-alpine
    container_name: tm-postgres-apps
    environment:
      POSTGRES_USER: togglemaster
      POSTGRES_PASSWORD: togglemaster
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - postgres-apps-data:/var/lib/postgresql/data
      - ./docker/postgres-apps-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./flag-service-main/db/init.sql:/schemas/flag.sql:ro
      - ./targeting-service-main/db/init.sql:/schemas/targeting.sql:ro
    healthcheck: *postgres-healthcheck
    networks: [togglemaster]

  redis:
    image: redis:7-alpine
    container_name: tm-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [togglemaster]

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: tm-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]
    networks: [togglemaster]

  # Cria a tabela no DynamoDB Local e encerra (roda uma única vez).
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: tm-dynamodb-init
    depends_on: [dynamodb-local]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo "aguardando dynamodb-local..."; sleep 2;
        done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name ToggleMasterAnalytics \
          --attribute-definitions AttributeName=event_id,AttributeType=S \
          --key-schema AttributeName=event_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "tabela ja existe"
        aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000
    networks: [togglemaster]

  # ----------------------------------------------------------------
  # Microsserviços
  # ----------------------------------------------------------------
  auth-service:
    build: ./auth-service-main
    container_name: tm-auth-service
    depends_on:
      postgres-auth: { condition: service_healthy }
    environment:
      PORT: "8001"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      DATABASE_URL: postgres://togglemaster:togglemaster@postgres-auth:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:-admin-local-dev}
    ports: ["8001:8001"]
    networks: [togglemaster]

  flag-service:
    build: ./flag-service-main
    container_name: tm-flag-service
    depends_on:
      postgres-apps: { condition: service_healthy }
      auth-service:  { condition: service_started }
    environment:
      PORT: "8002"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      DATABASE_URL: postgres://togglemaster:togglemaster@postgres-apps:5432/flag_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001
    ports: ["8002:8002"]
    networks: [togglemaster]

  targeting-service:
    build: ./targeting-service-main
    container_name: tm-targeting-service
    depends_on:
      postgres-apps: { condition: service_healthy }
      auth-service:  { condition: service_started }
    environment:
      PORT: "8003"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      DATABASE_URL: postgres://togglemaster:togglemaster@postgres-apps:5432/targeting_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001
    ports: ["8003:8003"]
    networks: [togglemaster]

  evaluation-service:
    build: ./evaluation-service-main
    container_name: tm-evaluation-service
    depends_on:
      redis:             { condition: service_healthy }
      flag-service:      { condition: service_started }
      targeting-service: { condition: service_started }
    environment:
      PORT: "8004"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      # Vazio = eventos SQS desabilitados (apenas log). Defina para usar SQS real.
      AWS_SQS_URL: ${AWS_SQS_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8004:8004"]
    networks: [togglemaster]

  analytics-service:
    build: ./analytics-service-main
    container_name: tm-analytics-service
    depends_on:
      dynamodb-local: { condition: service_started }
    environment:
      PORT: "8005"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      # DynamoDB aponta para o contêiner local; SQS continua na AWS.
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_SQS_URL: ${AWS_SQS_URL:-http://sqs-nao-configurado.local/queue}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8005:8005"]
    networks: [togglemaster]

volumes:
  postgres-auth-data:
  postgres-apps-data:

networks:
  togglemaster:
    driver: bridge
