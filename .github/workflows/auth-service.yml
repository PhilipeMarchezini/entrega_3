name: CI - auth-service

on:
  push:
    branches: [main]
    paths: ["auth-service-main/**", ".github/workflows/auth-service.yml"]
  pull_request:
    paths: ["auth-service-main/**", ".github/workflows/auth-service.yml"]

env:
  SERVICE_NAME: auth-service
  SERVICE_DIR: auth-service-main
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/auth-service

permissions:
  contents: write
  id-token: write

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download
      - run: go build -v ./...
      - run: go test -v ./... || true   # tolera ausência de testes nesta entrega

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.SERVICE_DIR }}

  security:
    name: Security (SAST + SCA)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # SAST com gosec
      - name: gosec (SAST)
        uses: securego/gosec@master
        with:
          args: -severity medium -no-fail -fmt sarif -out gosec.sarif ./${{ env.SERVICE_DIR }}/...

      # SCA com Trivy em modo fs - bloqueia em CRITICAL
      - name: Trivy fs (SCA - bloqueia CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Docker Build + Image Scan + Push ECR
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }} # Academy
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMAGE" ./${{ env.SERVICE_DIR }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Container Scan (Trivy) - bloqueia CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push para ECR
        run: docker push "$IMAGE"

  update-gitops:
    name: Atualiza GitOps (tag da imagem)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Atualiza tag em gitops/apps/auth-service/deployment.yaml
        env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          FILE="gitops/apps/auth-service/deployment.yaml"
          sed -i -E "s|(image: .*togglemaster/auth-service:).*|\1${NEW_TAG}|" "$FILE"
          echo "--- diff ---"
          git --no-pager diff "$FILE"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/auth-service/deployment.yaml
          git commit -m "ci(auth-service): bump image to ${{ needs.docker.outputs.image_tag }}" || echo "sem mudanca"
          git pull --rebase origin main
          git push
