name: CI - evaluation-service

on:
  push:
    branches: [main]
    paths: ["evaluation-service-main/**", ".github/workflows/evaluation-service.yml"]
  pull_request:
    paths: ["evaluation-service-main/**", ".github/workflows/evaluation-service.yml"]

env:
  SERVICE_NAME: evaluation-service
  SERVICE_DIR: evaluation-service-main
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/evaluation-service

permissions:
  contents: write
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: "${{ env.SERVICE_DIR }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      # tidy (e nao download) porque as dependencias do OpenTelemetry foram
      # adicionadas ao go.mod e o go.sum precisa ser regenerado.
      - run: go mod tidy
      - run: go build -v ./...
      - run: go test -v ./... || true

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go mod tidy
        working-directory: ${{ env.SERVICE_DIR }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          working-directory: ${{ env.SERVICE_DIR }}

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: gosec (SAST)
        uses: securego/gosec@master
        with:
          args: -severity medium -no-fail -fmt sarif -out gosec.sarif ./${{ env.SERVICE_DIR }}/...
      - name: Trivy fs (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./${{ env.SERVICE_DIR }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMAGE" ./${{ env.SERVICE_DIR }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push
        run: docker push "$IMAGE"

  update-gitops:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          FILE="gitops/apps/evaluation-service/deployment.yaml"
          sed -i -E "s|(image: .*togglemaster/evaluation-service:).*|\1${NEW_TAG}|" "$FILE"
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/evaluation-service/deployment.yaml
          git commit -m "ci(evaluation-service): bump image to ${{ needs.docker.outputs.image_tag }}" || echo "sem mudanca"
          git pull --rebase origin main
          git push
