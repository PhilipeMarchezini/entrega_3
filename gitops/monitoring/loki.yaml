################################################################
# Loki - centralizacao dos logs dos contêineres do cluster.
#
# Modo SingleBinary + storage filesystem: e' o unico arranjo que
# funciona no AWS Academy sem IRSA, ja' que o modo distribuido
# exige um bucket S3 e, com ele, uma role IAM que nao podemos criar.
################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0
    helm:
      values: |
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 168h        # 7 dias
            allow_structured_metadata: true
            volume_enabled: true

        singleBinary:
          replicas: 1
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          # Sem PVC: o cluster nao tem o addon aws-ebs-csi-driver (ele exige
          # IRSA, que o Academy nao permite), entao um PersistentVolumeClaim
          # ficaria Pending para sempre. Com emptyDir o Loki grava no disco
          # efemero do no'. A retencao de 7 dias abaixo continua valendo
          # enquanto o pod viver, o que basta para a demonstracao.
          persistence:
            enabled: false

        # Componentes do modo distribuido - desligados.
        backend:      { replicas: 0 }
        read:         { replicas: 0 }
        write:        { replicas: 0 }
        ingester:     { replicas: 0 }
        querier:      { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler: { replicas: 0 }
        distributor:  { replicas: 0 }
        compactor:    { replicas: 0 }
        indexGateway: { replicas: 0 }
        bloomCompactor: { replicas: 0 }
        bloomGateway: { replicas: 0 }

        # O chart sobe um cache Memcached por padrao; desnecessario nesta escala.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
