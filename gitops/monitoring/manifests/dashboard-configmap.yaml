################################################################
# Dashboard customizado "ToggleMaster - Visao Geral".
#
# O sidecar do Grafana varre os ConfigMaps com a label
# grafana_dashboard="1" e importa o JSON automaticamente - por isso
# o dashboard fica versionado no Git, e nao clicado na interface.
#
# Paineis: recursos do cluster, taxa de requisicoes por servico,
# latencia p95, taxa de 5xx e logs em tempo real via Loki.
################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "title": "ToggleMaster - Visao Geral",
      "uid": "togglemaster-overview",
      "tags": ["togglemaster", "fase4"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "row",
          "title": "Recursos do Cluster",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "CPU por no (%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{instance}}",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memoria por no (%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{instance}}",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pods por deployment (togglemaster)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{deployment}}",
              "expr": "kube_deployment_status_replicas_available{namespace=\"togglemaster\"}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Microsservicos (via OpenTelemetry)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }
        },
        {
          "type": "timeseries",
          "title": "Taxa de requisicoes por servico (req/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latencia p95 por servico",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "expr": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[5m])))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Taxa de 5xx - auth-service (%)",
          "description": "Metrica que alimenta o alerta de incidente da Fase 4.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 26 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(http_server_request_duration_seconds_count{service_name=\"auth-service\", http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name=\"auth-service\"}[5m])), 0.001))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Respostas por status code",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 16, "x": 8, "y": 26 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}} - {{http_response_status_code}}",
              "expr": "sum by (service_name, http_response_status_code) (rate(http_server_request_duration_seconds_count[5m]))"
            }
          ]
        },
        {
          "type": "row",
          "title": "Logs em tempo real (Loki)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }
        },
        {
          "type": "logs",
          "title": "Logs do namespace togglemaster",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 33 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{k8s_namespace_name=\"togglemaster\"}"
            }
          ]
        }
      ]
    }
