################################################################
# Inicializacao dos 3 bancos RDS.
#
# Cada `terraform apply` cria instancias RDS vazias: os bancos
# auth_db/flag_db/targeting_db existem, mas sem tabela nenhuma. Sem
# este Job o evaluation-service responde 502 porque o flag-service
# devolve 401 -- nao ha' nenhuma API key cadastrada para validar.
#
# Aplica o schema dos tres db/init.sql e semeia o minimo que a
# demonstracao precisa.
#
# NAO fica sob nenhuma Application do ArgoCD de proposito: Job e'
# imutavel, e um re-sync com spec alterado falharia. Aplique a mao,
# depois dos secrets:
#
#   kubectl apply -f gitops/db-init-job.yaml
#   kubectl wait --for=condition=complete job/db-init -n togglemaster --timeout=180s
#
# Para rodar de novo: kubectl delete job db-init -n togglemaster
# O SQL e' idempotente (IF NOT EXISTS / ON CONFLICT).
################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: togglemaster
spec:
  backoffLimit: 3
  template:
    metadata:
      name: db-init
    spec:
      # Never, e nao OnFailure: com OnFailure o job-controller APAGA o pod
      # ao esgotar o backoffLimit, e o log da falha se perde junto.
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: AUTH_URL
              valueFrom:
                secretKeyRef: { name: auth-secrets, key: database_url }
            - name: FLAG_URL
              valueFrom:
                secretKeyRef: { name: flag-secrets, key: database_url }
            - name: TARGETING_URL
              valueFrom:
                secretKeyRef: { name: targeting-secrets, key: database_url }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "== auth_db: schema + API key de servico =="
              psql "$AUTH_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS api_keys (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(100) NOT NULL,
                  key_hash VARCHAR(64) NOT NULL UNIQUE,
                  is_active BOOLEAN DEFAULT true,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- SHA-256 de 'admin-secreto-123', que e' o service_api_key
              -- usado pelo evaluation-service ao chamar flag e targeting.
              -- Precisa bater com gitops/secrets.yaml.
              INSERT INTO api_keys (name, key_hash, is_active)
              VALUES ('servico-interno',
                      '815c79fbfae5f815b8e66f610bb1899c9ad7124499f1cc5eca31050b3c62e9d9',
                      true)
              ON CONFLICT (key_hash) DO UPDATE SET is_active = true;
              SQL

              echo "== flag_db: schema + flag de demonstracao =="
              psql "$FLAG_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS flags (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(100) UNIQUE NOT NULL,
                  description TEXT,
                  is_enabled BOOLEAN NOT NULL DEFAULT false,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- Dollar-quoting com $fn$ e nao com $$: o Kubernetes trata
              -- '$$' em command/args como escape para um '$' literal, entao
              -- o PostgreSQL recebia 'AS $' e falhava com
              -- "syntax error at or near $".
              CREATE OR REPLACE FUNCTION trigger_set_timestamp()
              RETURNS TRIGGER AS $fn$
              BEGIN
                NEW.updated_at = NOW();
                RETURN NEW;
              END;
              $fn$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS set_timestamp ON flags;
              CREATE TRIGGER set_timestamp BEFORE UPDATE ON flags
              FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();

              -- 'nova-home' e' a flag usada na carga do Bloco 3 do video.
              INSERT INTO flags (name, description, is_enabled)
              VALUES ('nova-home', 'Nova home page - demonstracao Fase 4', true)
              ON CONFLICT (name) DO UPDATE SET is_enabled = true;

              INSERT INTO flags (name, description, is_enabled)
              VALUES ('checkout-v2', 'Checkout redesenhado', true)
              ON CONFLICT (name) DO NOTHING;
              SQL

              echo "== targeting_db: schema + regra de segmentacao =="
              psql "$TARGETING_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS targeting_rules (
                  id SERIAL PRIMARY KEY,
                  flag_name VARCHAR(100) UNIQUE NOT NULL,
                  is_enabled BOOLEAN NOT NULL DEFAULT true,
                  rules JSONB NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- Dollar-quoting com $fn$ e nao com $$: o Kubernetes trata
              -- '$$' em command/args como escape para um '$' literal, entao
              -- o PostgreSQL recebia 'AS $' e falhava com
              -- "syntax error at or near $".
              CREATE OR REPLACE FUNCTION trigger_set_timestamp()
              RETURNS TRIGGER AS $fn$
              BEGIN
                NEW.updated_at = NOW();
                RETURN NEW;
              END;
              $fn$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;
              CREATE TRIGGER set_timestamp BEFORE UPDATE ON targeting_rules
              FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();

              -- 50% dos usuarios: garante que a carga do video produza
              -- tanto 'true' quanto 'false', deixando o trace mais rico.
              INSERT INTO targeting_rules (flag_name, is_enabled, rules)
              VALUES ('nova-home', true, '{"type": "PERCENTAGE", "value": 50}'::jsonb)
              ON CONFLICT (flag_name) DO UPDATE SET rules = EXCLUDED.rules;
              SQL

              echo
              echo "== conferencia =="
              psql "$AUTH_URL"      -tAc "SELECT 'api_keys ativas: '      || count(*) FROM api_keys WHERE is_active;"
              psql "$FLAG_URL"      -tAc "SELECT 'flags: '                || count(*) FROM flags;"
              psql "$TARGETING_URL" -tAc "SELECT 'regras de targeting: '  || count(*) FROM targeting_rules;"
              echo "OK"
