################################################################
# Acesso externo via Nginx Ingress Controller.
#
# São dois Ingress porque a anotação rewrite-target vale para todas
# as regras do mesmo objeto:
#   - togglemaster-direct : serviços cujas rotas já batem com o
#     prefixo público (/flags, /rules, /evaluate) - sem reescrita.
#   - togglemaster-rewrite: serviços cujas rotas internas não têm o
#     prefixo (/validate, /admin/keys, /health) - com reescrita.
#
# Exemplos:
#   curl http://<LB>/flags
#   curl http://<LB>/auth/validate
#   curl http://<LB>/analytics/health
################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-direct
  namespace: togglemaster
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port: { number: 80 }
          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port: { number: 80 }
          - path: /evaluate
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-rewrite
  namespace: togglemaster
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /auth/validate -> auth-service:/validate
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port: { number: 80 }
          # /analytics/health -> analytics-service:/health
          - path: /analytics(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: analytics-service
                port: { number: 80 }
