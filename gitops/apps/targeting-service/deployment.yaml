apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels: { app: targeting-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: targeting-service } }
  template:
    metadata:
      labels: { app: targeting-service }
    spec:
      containers:
        - name: targeting-service
          image: 661099433763.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service:v1.0.0-0b5ff20
          ports: [{ containerPort: 8003 }]
          env:
            - name: PORT
              value: "8003"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: targeting-secrets, key: database_url } }
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.togglemaster.svc.cluster.local"
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  selector: { app: targeting-service }
  ports: [{ port: 80, targetPort: 8003 }]
