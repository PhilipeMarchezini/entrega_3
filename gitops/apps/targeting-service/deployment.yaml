apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels: { app: targeting-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: targeting-service } }
  template:
    metadata:
      labels: { app: targeting-service }
    spec:
      containers:
        - name: targeting-service
          image: 436964578473.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service:v1.0.0-e56ca92
          ports: [{ containerPort: 8003 }]
          env:
            - name: PORT
              value: "8003"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: targeting-secrets, key: database_url } }
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.togglemaster.svc.cluster.local"
            # --- OpenTelemetry (instrumentacao automatica via opentelemetry-instrument) ---
            - name: OTEL_SERVICE_NAME
              value: "targeting-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=hml"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  selector: { app: targeting-service }
  ports: [{ port: 80, targetPort: 8003 }]
