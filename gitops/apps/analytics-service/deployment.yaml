apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
  labels: { app: analytics-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      containers:
        - name: analytics-service
          image: 661099433763.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service:v1.0.0-74af710
          ports: [{ containerPort: 8005 }]
          env:
            - name: PORT
              value: "8005"
            - name: AWS_DYNAMODB_TABLE
              value: "ToggleMasterAnalytics"
            - name: AWS_SQS_URL
              valueFrom: { secretKeyRef: { name: analytics-secrets, key: sqs_queue_url } }
            - name: AWS_REGION
              value: "us-east-1"
            # --- OpenTelemetry (instrumentacao automatica via opentelemetry-instrument) ---
            - name: OTEL_SERVICE_NAME
              value: "analytics-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=hml"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  selector: { app: analytics-service }
  ports: [{ port: 80, targetPort: 8005 }]
