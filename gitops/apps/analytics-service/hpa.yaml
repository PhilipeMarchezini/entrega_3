################################################################
# HPA do analytics-service - escala pelo uso médio de CPU.
#
# Workaround do AWS Academy (Opção A): não é possível usar KEDA por
# profundidade da fila SQS, pois o KEDA depende de IRSA (criação de
# roles IAM). Quando a fila SQS enche, o worker processa mais
# mensagens, a CPU sobe e o HPA adiciona pods - efeito equivalente,
# só que indireto.
################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
