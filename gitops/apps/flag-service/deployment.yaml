apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels: { app: flag-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: flag-service } }
  template:
    metadata:
      labels: { app: flag-service }
    spec:
      containers:
        - name: flag-service
          image: 661099433763.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service:v1.0.0-0b5ff20
          ports: [{ containerPort: 8002 }]
          env:
            - name: PORT
              value: "8002"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: flag-secrets, key: database_url } }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: togglemaster
spec:
  selector: { app: flag-service }
  ports: [{ port: 80, targetPort: 8002 }]
