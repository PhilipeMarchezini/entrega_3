################################################################
# TEMPLATE de secrets - NÃO commitar com valores reais.
# Aplique manualmente após o Terraform criar a infra:
#   kubectl apply -f secrets-template.yaml  (depois de preencher)
################################################################
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: togglemaster
type: Opaque
stringData:
  database_url: "postgres://togglemaster:SENHA@<RDS_AUTH_ENDPOINT>:5432/auth_db"
  master_key:   "admin-secreto-123"
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secrets
  namespace: togglemaster
type: Opaque
stringData:
  database_url: "postgres://togglemaster:SENHA@<RDS_FLAG_ENDPOINT>:5432/flag_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-secrets
  namespace: togglemaster
type: Opaque
stringData:
  database_url: "postgres://togglemaster:SENHA@<RDS_TARGETING_ENDPOINT>:5432/targeting_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-secrets
  namespace: togglemaster
type: Opaque
stringData:
  # ATENCAO: o prefixo redis:// e' obrigatorio. O codigo usa redis.ParseURL(),
  # que rejeita o endpoint cru com "invalid URL scheme" e derruba o pod em
  # CrashLoopBackOff.
  redis_addr:    "redis://<REDIS_ENDPOINT>:6379"
  sqs_queue_url: "<SQS_QUEUE_URL>"
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: togglemaster
type: Opaque
stringData:
  sqs_queue_url: "<SQS_QUEUE_URL>"
